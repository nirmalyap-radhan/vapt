<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VulnLab</title>
<style>
  body{font-family:Arial,sans-serif; background:#f4f4f4; margin:0;}
  nav{background:#222; padding:14px 24px;}
  nav a{color:#fff; text-decoration:none; margin-right:18px; font-size:14px;}
  .container{max-width:700px; margin:30px auto; background:#fff; padding:24px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  input,textarea{width:100%; padding:8px; margin:6px 0 14px; border:1px solid #ccc; border-radius:4px;}
  button{background:#c0392b; color:#fff; border:none; padding:10px 18px; border-radius:4px; cursor:pointer;}
  .error{color:#c0392b;}
  .comment{border-bottom:1px solid #eee; padding:10px 0;}
  footer{text-align:center; color:#999; font-size:11px; margin:30px 0;}
</style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/search">Search</a>
  <a href="/comments">Comments</a>
  <a href="/login">Login</a>
  {% if user %}<a href="/profile?id=1">Profile</a><a href="/logout">Logout ({{ user }})</a>{% endif %}
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<footer>VulnLab — intentionally vulnerable practice app. Local testing only.</footer>
</body>
</html>
