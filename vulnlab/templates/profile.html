{% extends "base.html" %}
{% block content %}
<h2>Profile</h2>
{% if profile %}
<p><b>ID:</b> {{ profile[0] }}</p>
<p><b>Username:</b> {{ profile[1] }}</p>
<p><b>Email:</b> {{ profile[2] }}</p>
<form method="POST" action="/update_profile">
  <input type="hidden" name="id" value="{{ profile[0] }}">
  <label>Bio</label>
  <textarea name="bio">{{ profile[3] }}</textarea>
  <button type="submit">Update Bio</button>
</form>
{% else %}
<p>No such profile.</p>
{% endif %}
{% endblock %}
